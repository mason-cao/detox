# Railway service config for the Detox API.
#
# Build context is the repo root so the Dockerfile can copy both api/
# and agent/. Railway picks up this file at the project root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"

[deploy]
startCommand = "uvicorn api.app.main:app --host 0.0.0.0 --port ${PORT:-8080}"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
