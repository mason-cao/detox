# Railway service config for the Detox API.
#
# Build context is the repo root so the Dockerfile can copy both api/
# and agent/. Railway picks up this file at the project root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "api/Dockerfile"

[deploy]
# Start command comes from the Dockerfile CMD (which uses sh -c so ${PORT}
# is interpolated). Setting it here would bypass that and run the literal
# string without shell expansion.
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
